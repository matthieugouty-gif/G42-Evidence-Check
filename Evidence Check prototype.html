    const TODAY = new Date().toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });

    function formatStamp(t) {
      if (!t || t === "—" || t.indexOf("·") !== -1) return t;
      return TODAY + " · " + t;

    function nowHHMM() {
      const d = new Date();
      return TODAY + " · " + String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
    }

    const NEW_DECISION = { status: "proposed", optionId: null, reason: "", remember: false, at: "", by: "", reviewed: false };

    function initialDecision(c) {
      if (c.autonomy.mode === "auto") {
        return { status: "decided", optionId: c.recommendedId, reason: "", remember: false, at: "09:44", by: "system", reviewed: false };
      }
      return NEW_DECISION;
    }

    function getEffective(c, decision) {
      const conflict = c.figures[c.conflictId];
      const optId = decision.status === "decided" ? decision.optionId : c.recommendedId;
      const opt = conflict.options[optId];
      const derived = c.derived ? c.derived.compute(optId) : null;
      return { optId, opt, derived, conflict };
    }

    function figureText(c, figId, eff) {
      const f = c.figures[figId];
      if (f.kind === "verified") return f.valueText;
      if (f.kind === "conflict") return eff.opt.valueText;
      return eff.derived.ratioText;
    }

    function figureStatus(c, figId, decision) {
      const f = c.figures[figId];
      if (f.kind === "conflict") return decision.status === "decided" ? (decision.by === "system" ? "system" : "decided") : "proposed";
      return "verified";
    }

    function buildChain(c, figId, decision, eff, history) {
      const f = c.figures[figId];
      const steps = [...(c.audit[figId] || [])];
      if (f.kind === "conflict" && decision.status !== "decided") {
        steps.push({ time: "—", actor: "System", text: "Waiting for your decision." });
      }
      if (f.kind === "derived") {
        steps.push({ time: "09:47", actor: "Resolver", text: "Result: " + eff.derived.ratioText + " with headroom of " + eff.derived.headroomText + " against the " + c.figures.cap.valueText + " limit." });
      }
      (history[figId] || []).forEach((h) => steps.push(h));
      return steps;
    }

              <button onClick={onClose} aria-label="Close" className="text-slate-500 hover:text-slate-800 text-xl px-2">✕</button>
            </div>
            <div className="p-6 space-y-2">
              {doc.rows.map((row, i) => (
                <div
                  key={i}
                  className={"p-3 rounded-lg " + (row.hl ? "bg-yellow-100 border-l-4 border-yellow-400" : "bg-slate-50")}
                >
                  {doc.kind === "quote" ? (
                    <div className="font-serif text-base text-slate-800 leading-relaxed">
                      <span className="font-semibold">{row.label}</span> {row.value}
                    </div>
                  ) : (
                    <div className="flex justify-between gap-4 text-base">
                      <span className="text-slate-700">{row.label}</span>
                      <span className={"text-right tabular-nums " + (row.hl ? "font-bold text-slate-900" : "text-slate-800")}>{row.value}</span>
                    </div>
                  )}
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ======================================================================
    // MEMO
    // ======================================================================
    function MemoCard({ c, eff, decision, selectedFigure, onSelect }) {
      return (
        <div className="bg-white rounded-xl border border-slate-200 p-8">
          <h2 className="text-2xl font-bold text-slate-900">{c.memo.title}</h2>
          <p className="text-sm text-slate-500 mb-5">Memo ID: {c.memo.id} · Showing the key figures from: {c.start.keySections.join(", ")} (the full memo has more sections)</p>
          <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-7 pb-7 border-b border-slate-200">
            {c.memo.facts.map((f, i) => (
              <div key={i}>
                <p className="text-sm font-semibold text-slate-500">{f[0]}</p>
                <p className="text-base text-slate-900">{f[1]}</p>
              </div>
            ))}
          </div>
          <div className="space-y-6 text-base text-slate-700 leading-loose">
            {c.paragraphs.map((p, i) => (
              <p key={i}>
                {p.map((tok, j) => {
                  if (typeof tok === "string") return <span key={j}>{tok}</span>;
                  if (tok.chip) {
                    return (
                      <FigureChip
                        key={j}
                        valueText={figureText(c, tok.chip, eff)}
                        status={figureStatus(c, tok.chip, decision)}
                        selected={selectedFigure === tok.chip}
                        onClick={() => onSelect(tok.chip)}
                      />
                    );
                  }
                  return <strong key={j} className="text-slate-900">{eff.derived[tok.derived]}</strong>;
                })}
              </p>
            ))}
          </div>
        </div>
      );
    }

    // ======================================================================
    // EVIDENCE PANEL
    // ======================================================================
    function FeedbackBar({ figId, onSend }) {
      const [choice, setChoice] = useState(null);
      const [note, setNote] = useState("");
      const [sent, setSent] = useState(false);
      if (sent) return <p className="text-sm text-green-700">✓ Thanks. Your feedback went to the product team.</p>;
      return (
        <div className="pt-3 border-t border-slate-200 space-y-2">
          <p className="text-sm font-semibold text-slate-700">Was this explanation helpful?</p>
          <div className="flex gap-2">
            <button onClick={() => setChoice("yes")} className={"px-3 py-1 rounded-lg border text-sm " + (choice === "yes" ? "bg-green-50 border-green-400 text-green-800" : "border-slate-300 text-slate-700")}>Yes</button>
            <button onClick={() => setChoice("no")} className={"px-3 py-1 rounded-lg border text-sm " + (choice === "no" ? "bg-amber-50 border-amber-400 text-amber-800" : "border-slate-300 text-slate-700")}>No</button>
          </div>
          {choice && (
            <div className="space-y-2">
              <input type="text" value={note} onChange={(e) => setNote(e.target.value)} placeholder="Add a comment (optional)" className="w-full p-2 rounded border border-slate-300 text-sm" />
              <button onClick={() => { onSend(figId, choice === "yes", note.trim()); setSent(true); }} className="px-3 py-1 rounded-lg bg-blue-600 text-white text-sm font-medium hover:bg-blue-700">Send feedback</button>
            </div>
          )}
        </div>
      );
    }

    function EvidencePanel(props) {
      const { c, selectedFigure, decision, eff, draftOption, draftReason, draftRemember, editing,
        onDraftOption, onDraftReason, onDraftRemember, onConfirm, onSelect, onShowDoc, onEdit, onCancelEdit, onGoToAudit, onAcknowledge, onFeedback } = props;

      if (!selectedFigure) {
        return (
          <div className="bg-white rounded-xl border border-slate-200 p-6 text-center text-slate-500 text-base">
            Click any highlighted figure in the memo to see where it comes from.
          </div>
        );
      }

      const figure = c.figures[selectedFigure];
      if (!figure) return null;

      const linkClass = "text-blue-600 hover:text-blue-800 text-sm font-medium underline-offset-2 hover:underline";

      if (figure.kind === "verified") {
        return (
          <div className="bg-white rounded-xl border border-slate-200 p-6 space-y-4">
            <h3 className="text-lg font-semibold text-slate-900">{figure.label}</h3>
            <p className="text-3xl font-bold text-slate-900">{figure.valueText}</p>
            <StatusPill status="verified" label="Verified" />
            <p className="text-base text-slate-700">{figure.why}</p>
            <div className="space-y-1">
              <p className="text-sm font-semibold text-slate-900">{figure.sources.length > 1 ? "Sources that agree" : "Source"}</p>
              {figure.sources.map((src, i) => (
                <p key={i} className="text-sm text-slate-700">✓ {src.name} — {src.text}{src.note ? " (" + src.note + ")" : ""}{src.docId && <button onClick={() => onShowDoc(src.docId)} className={"ml-2 " + linkClass}>See in document →</button>}</p>
              ))}
              {figure.vendorNote && <p className="text-sm text-slate-500">{figure.vendorNote}</p>}
            </div>
            <div className="flex flex-col items-start gap-2">
              {figure.docId && !figure.sources.some((s) => s.docId) && <button onClick={() => onShowDoc(figure.docId)} className={linkClass}>See in document →</button>}
              <button onClick={() => onGoToAudit(selectedFigure)} className={linkClass}>See how we got here →</button>
            </div>
          </div>
        );
      }

      if (figure.kind === "derived") {
        return (
          <div className="bg-white rounded-xl border border-slate-200 p-6 space-y-4">
            <h3 className="text-lg font-semibold text-slate-900">{figure.label}</h3>
            <p className="text-3xl font-bold text-slate-900">{eff.derived.ratioText}</p>
            <StatusPill status="verified" label="Within limit" />
            <p className="text-base text-slate-700">{eff.derived.line}</p>
            <p className="text-sm text-slate-600">This follows the EBITDA decision.</p>
            <div className="flex flex-col items-start gap-2">
              <button onClick={() => onSelect(c.conflictId)} className={linkClass}>Review EBITDA →</button>
              <button onClick={() => onGoToAudit(selectedFigure)} className={linkClass}>See how we got here →</button>
            </div>
          </div>
        );
      }

      // conflict
      const decided = decision.status === "decided";
      const recId = c.recommendedId;
      const draftIsRec = draftOption === recId;
      const draftData = figure.options[draftOption];
      const confirmDisabled = !draftIsRec && !draftReason.trim();

      if (decided && !editing && decision.by === "system") {
        const d = figure.options[decision.optionId];
        return (
          <div className="bg-white rounded-xl border border-slate-200 p-6 space-y-4">
            <h3 className="text-lg font-semibold text-slate-900">{figure.label}</h3>
            <p className="text-3xl font-bold text-slate-900">{d.valueText}</p>
            <StatusPill status="system" label="Decided by the system" />
            <p className="text-base text-slate-600">{c.gapNote}</p>
            <div className="p-4 bg-sky-50 border border-sky-200 rounded-lg text-base space-y-1">
              <p className="font-semibold text-sky-900">Decided by the system · {formatStamp(decision.at)}</p>
              <p className="text-sky-900">{d.label} — {d.valueText}</p>
              <p className="text-sky-900">Why: {c.autonomy.autoReason}</p>
              <p className="text-sm text-sky-800 italic">{c.rule}</p>
            </div>
            <p className="text-base text-slate-700">{d.why}</p>
            <FeedbackBar figId={selectedFigure} onSend={onFeedback} />
            <div className="flex flex-wrap items-center gap-3">
              {decision.reviewed
                ? <span className="text-sm text-green-700">✓ You reviewed this decision</span>
                : <button onClick={onAcknowledge} className="px-4 py-2 rounded-lg bg-blue-600 text-white text-base font-medium hover:bg-blue-700">Accept the system's decision</button>}
              <button onClick={onEdit} className={linkClass}>Change decision</button>
            </div>
            <div className="flex flex-col items-start gap-2">
              {(d.docLinks || (d.docId ? [{ label: "See in document →", docId: d.docId }] : [])).map((l) => (
                <button key={l.docId} onClick={() => onShowDoc(l.docId)} className={linkClass}>{l.label}</button>
              ))}
              <button onClick={() => onGoToAudit(selectedFigure)} className={linkClass}>See how we got here →</button>
            </div>
          </div>
        );
      }

      if (decided && !editing) {
        const d = figure.options[decision.optionId];
        return (
          <div className="bg-white rounded-xl border border-slate-200 p-6 space-y-4">
            <h3 className="text-lg font-semibold text-slate-900">{figure.label}</h3>
            <p className="text-3xl font-bold text-slate-900">{d.valueText}</p>
            <StatusPill status="decided" label="Decided by you" />
            <div className="p-4 bg-blue-50 border border-blue-200 rounded-lg text-base space-y-1">
              <p className="font-semibold text-blue-900">Decided by {c.user} · {formatStamp(decision.at)}</p>
              <p className="text-blue-800">{d.label} — {d.valueText}</p>
              <p className="text-blue-800">{decision.reason ? "Reason: " + decision.reason : "Accepted the system's decision."}</p>
              {(d.docLinks || (d.docId ? [{ label: "See the evidence for this figure →", docId: d.docId }] : [])).map((l) => (
                <button key={l.docId} onClick={() => onShowDoc(l.docId)} className={"block " + linkClass}>{l.label}</button>
              ))}
              {decision.remember && <p className="text-sm text-blue-700">Saved as the default rule for {c.clientName} memos.</p>}
              <FeedbackBar figId={selectedFigure} onSend={onFeedback} />
            </div>
            <div className="flex flex-col items-start gap-2">
              <button onClick={onEdit} className={linkClass}>Change decision</button>
              <button onClick={() => onGoToAudit(selectedFigure)} className={linkClass}>See how we got here →</button>
            </div>
          </div>
        );
      }

      return (
        <div className="bg-white rounded-xl border border-slate-200 p-6 space-y-4">
          <h3 className="text-lg font-semibold text-slate-900">{figure.label}</h3>
          <p className="text-3xl font-bold text-slate-900">{eff.opt.valueText}</p>
          {decided
            ? <StatusPill status="decided" label={decision.by === "system" ? "Decided by the system — changing" : "Decided by you — changing"} />
            : <StatusPill status="proposed" label="Needs your review" />}
          <p className="text-base text-slate-600">{c.gapNote}</p>
          {!decided && c.autonomy.signoffReason && <p className="text-base font-medium text-amber-800">{c.autonomy.signoffReason}</p>}

          <div className="pt-4 border-t border-slate-200">
            <h4 className="font-semibold text-slate-900 mb-3 text-base">{figure.verdict.heading}</h4>
            <div className="space-y-3">
              {Object.values(figure.options).map((opt) => (
                <label
                  key={opt.id}
                  className={"block p-4 rounded-lg border-2 cursor-pointer transition " + (draftOption === opt.id ? "border-blue-600 bg-blue-50" : "border-slate-200 bg-slate-50 hover:border-slate-300")}
                >
                  <div className="flex items-start gap-3">
                    <input type="radio" name={"opt-" + figure.id} checked={draftOption === opt.id} onChange={() => onDraftOption(opt.id)} className="mt-1.5 w-4 h-4" />
                    <div className="flex-1">
                      <div className="flex flex-wrap items-center gap-2 mb-1">
                        <span className="font-medium text-slate-900 text-base">{opt.label}</span>
                        {opt.recommended && <span className="text-xs font-semibold bg-green-100 text-green-700 px-2 py-0.5 rounded">System's choice</span>}
                      </div>
                      <p className="text-2xl font-bold text-slate-900">{opt.valueText}</p>
                      <p className="text-sm text-slate-600 mt-1">{c.impact(opt)}</p>
                    </div>
                  </div>
                </label>
              ))}
            </div>

            <div className="mt-4 p-4 bg-slate-50 rounded-lg border border-slate-200 space-y-2">
              <p className="font-semibold text-slate-900 text-base">Why this figure</p>
              <p className="text-base text-slate-700">{draftData.why}</p>
              <p className="text-sm text-slate-600">{draftData.detail}</p>
              {(draftData.docLinks || (draftData.docId ? [{ label: "See in document →", docId: draftData.docId }] : [])).map((l) => (
                <button key={l.docId} onClick={() => onShowDoc(l.docId)} className={"block " + linkClass}>{l.label}</button>
              ))}
              {!draftData.docLinks && !draftData.docId && draftData.vendorNote && <p className="text-sm text-slate-500">{draftData.vendorNote}</p>}
              <p className="text-sm text-slate-500 italic pt-2 border-t border-slate-200">{c.rule}</p>
            </div>

            <div className="mt-4">
              <label className="block text-sm font-semibold text-slate-900 mb-2">
                {draftIsRec ? "Add a note (optional)" : "Why are you choosing a different figure? (required)"}
              </label>
              <textarea
                value={draftReason}
                onChange={(e) => onDraftReason(e.target.value)}
                placeholder={draftIsRec ? "" : "e.g. Committee policy is to use vendor-standard figures"}
                rows={draftIsRec ? 2 : 3}
                className="w-full p-3 rounded-lg border border-slate-300 text-base focus:outline-none focus:ring-2 focus:ring-blue-600"
              />
            </div>

            <label className="flex items-center gap-2 mt-4">
              <input type="checkbox" checked={draftRemember} onChange={(e) => onDraftRemember(e.target.checked)} className="w-4 h-4" />
              <span className="text-base text-slate-700">Remember this choice for future {c.clientName} memos</span>
            </label>

            <div className="flex gap-2 mt-4">
              <button
                onClick={onConfirm}
                disabled={confirmDisabled}
                className={"flex-1 py-2.5 rounded-lg font-medium text-base transition " + (confirmDisabled ? "bg-slate-200 text-slate-500 cursor-not-allowed" : "bg-blue-600 text-white hover:bg-blue-700")}
              >
                {draftIsRec ? figure.verdict.confirmLabel : figure.verdict.challengeLabel}
              </button>
              {editing && (
                <button onClick={onCancelEdit} className="px-4 py-2.5 rounded-lg font-medium text-base text-slate-700 hover:bg-slate-100">Cancel</button>
              )}
            </div>
            <button onClick={() => onGoToAudit(selectedFigure)} className={"mt-3 " + linkClass}>See how we got here →</button>
          </div>
        </div>
      );
    }

    // ======================================================================
    // ASK BOX
    // ======================================================================
    function AskBox({ c, eff, decision, messages, onAdd, onShowDoc }) {
      const [lang, setLang] = useState("en");
      const [input, setInput] = useState("");

      const ask = (question) => {
        const text = question.trim();
        if (!text) return;
        const ctx = {
          overridden: decision.status === "decided" && decision.optionId !== c.recommendedId,
          effLabel: eff.opt.label,
          effValueText: eff.opt.valueText,
          effDocId: eff.opt.docId,
          effNum: eff.opt.value,
          ratioText: eff.derived ? eff.derived.ratioText : "",
          headroomText: eff.derived ? eff.derived.headroomText : "",
        };
        const res = c.qa.answer(text, lang, ctx);
        onAdd({ q: text, a: res.text, lang, docs: res.docs });
        setInput("");
      };

      const suggestions = lang === "en" ? c.qa.en : c.qa.ar;

      return (
        <div className="bg-white rounded-xl border border-slate-200 p-6">
          <h3 className="text-lg font-semibold text-slate-900 mb-4">Ask about this memo</h3>
          <div className="flex gap-2 mb-3">
            <input
              type="text"
              value={input}
              onChange={(e) => setInput(e.target.value)}
              onKeyDown={(e) => { if (e.key === "Enter") ask(input); }}
              dir={lang === "ar" ? "rtl" : "ltr"}
              placeholder={lang === "ar" ? "اسأل عن هذه المذكرة..." : "Ask a question..."}
              className="flex-1 px-4 py-2 border border-slate-300 rounded-lg text-base focus:outline-none focus:ring-2 focus:ring-blue-600"
            />
            <div className="flex border border-slate-300 rounded-lg overflow-hidden">
              <button onClick={() => setLang("en")} className={"px-3 py-2 text-sm font-medium " + (lang === "en" ? "bg-blue-600 text-white" : "bg-slate-50 text-slate-600")}>English</button>
              <button onClick={() => setLang("ar")} className={"px-3 py-2 text-sm font-medium border-l border-slate-300 " + (lang === "ar" ? "bg-blue-600 text-white" : "bg-slate-50 text-slate-600")}>العربية</button>
            </div>
          </div>
          <div className="flex flex-col gap-2" dir={lang === "ar" ? "rtl" : "ltr"}>
            {suggestions.map((q, i) => (
              <button key={i} onClick={() => ask(q)} className={"px-3 py-2 rounded-lg border border-slate-200 hover:border-slate-300 text-base text-slate-700 " + (lang === "ar" ? "text-right" : "text-left")}>{q}</button>
            ))}
          </div>

          {messages.length > 0 && (
            <div className="mt-5 pt-5 border-t border-slate-200 space-y-4">
              {messages.map((m, i) => (
                <div key={i} dir={m.lang === "ar" ? "rtl" : "ltr"} className="space-y-2">
                  <div className="flex justify-end">
                    <div className="bg-slate-100 text-slate-900 px-4 py-2 rounded-lg max-w-md text-base">{m.q}</div>
                  </div>
                  <div className="flex justify-start">
                    <div className="bg-blue-50 border border-blue-100 px-4 py-3 rounded-lg max-w-lg text-base text-slate-800 space-y-2">
                      <p>{m.a}</p>
                      {m.docs.length > 0 && (
                        <div className="flex flex-wrap gap-3" dir="ltr">
                          {m.docs.map((d) => (
                            <button key={d} onClick={() => onShowDoc(d)} className="text-sm text-blue-700 underline">
                              {c.documents[d].name} p.{c.documents[d].page}
                            </button>
                          ))}
                        </div>
                      )}
                    </div>
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    // ======================================================================
    // TAB: WHERE WE LOOKED
    // ======================================================================
    function PlatformView({ c, feedback }) {
      const p = c.platform;
      const th = "py-2 pr-3 font-semibold text-slate-500 text-left";
      const td = "py-2 pr-3 align-top text-slate-700";
      const card = "bg-white rounded-xl border border-slate-200 p-6";
      return (
        <div className="max-w-6xl space-y-6">
          <div>
            <div className="flex flex-wrap items-center gap-3 mb-1">
              <h2 className="text-2xl font-bold text-slate-900">Platform insights</h2>
              <span className="text-sm font-medium px-2.5 py-1 rounded-full bg-slate-900 text-white">Product team view · not shown to clients</span>
            </div>
            <p className="text-base text-slate-600 mb-1">{p.workflow}. Across many memos: how the router and the resolution engine perform, what users say, and what to improve next.</p>
            <p className="text-sm text-slate-500 italic">{p.period}. Illustrative demo data. Cost and response times are shown here for the product team, not in the client's view.</p>
            <p className="text-sm text-slate-600 mt-1">Scope of this demo: quality is judged from client feedback only, meaning what users accept, override, rate and report.</p>
          </div>

          <div className="grid grid-cols-1 sm:grid-cols-4 gap-4">
            {p.tiles.map((t, i) => (
              <div key={i} className="bg-white rounded-xl border border-slate-200 p-4">
                <p className="text-sm text-slate-600">{t.label}</p>
                <p className="text-3xl font-bold text-slate-900">{t.value}</p>
                <p className="text-sm text-slate-500">{t.note}</p>
              </div>
            ))}
          </div>

          <div className={card}>
            <h3 className="font-semibold text-slate-900 text-lg mb-1">Router: is each source worth calling?</h3>
            <p className="text-sm text-slate-500 mb-3">Per source, across memos: how often it was used, how often it supplied a figure or changed the answer, and what it costs and how fast it responds.</p>
            <div className="overflow-x-auto">
              <table className="w-full text-sm">
                <thead>
                  <tr className="border-b border-slate-200">
                    <th className={th}>Source</th>
                    <th className={th}>Used</th>
                    <th className={th}>Supplied a figure</th>
                    <th className={th}>Changed the answer</th>
                    <th className={th}>Cost per call</th>
                    <th className={th}>Response time</th>
                    <th className={th}>What this suggests</th>
                  </tr>
                </thead>
                <tbody>
                  {p.router.map((r, i) => (
                    <tr key={i} className="border-b border-slate-100">
                      <td className={td + " font-medium text-slate-900"}>{r.name}</td>
                      <td className={td}>{r.used}</td>
                      <td className={td}>{r.supplied}</td>
                      <td className={td}>{r.changed}</td>
                      <td className={td}>{r.cost}</td>
                      <td className={td}>{r.time}</td>
                      <td className={td}>{r.note}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>

          <div className={card}>
            <h3 className="font-semibold text-slate-900 text-lg mb-1">Resolution engine: do users accept its decisions?</h3>
            <p className="text-sm text-slate-500 mb-3">For each type of resolution: how often users accepted it as is, how often they overrode it, and why.</p>
            <div className="overflow-x-auto">
              <table className="w-full text-sm">
                <thead>
                  <tr className="border-b border-slate-200">
                    <th className={th}>Resolution type</th>
                    <th className={th}>Issued</th>
                    <th className={th}>Accepted as is</th>
                    <th className={th}>Overridden</th>
                    <th className={th}>Why users overrode it</th>
                    <th className={th}>What this suggests</th>
                  </tr>
                </thead>
                <tbody>
                  {p.resolution.map((r, i) => (
                    <tr key={i} className="border-b border-slate-100">
                      <td className={td + " font-medium text-slate-900"}>{r.verdict}</td>
                      <td className={td}>{r.issued}</td>
                      <td className={td}>{r.accepted}</td>
                      <td className={td}>{r.overridden}</td>
                      <td className={td}>{r.reasons}</td>
                      <td className={td}>{r.note}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
            <div className="mt-4 pt-4 border-t border-slate-200">
              <p className="font-semibold text-slate-900 text-base mb-2">Autonomy dial: should the system decide on its own?</p>
              {p.autonomy.map((a, i) => (
                <p key={i} className="text-base text-slate-700">{a.type}: {a.rate}. Current setting: <span className="font-medium text-slate-900">{a.setting}</span>. {a.suggestion}</p>
              ))}
            </div>
          </div>

          <div className={card}>

              <div className="border border-slate-200 rounded-lg p-4">
                <p className="text-sm text-slate-600">Average rating of the explanations</p>

                <p className="text-sm text-slate-500">{p.feedback.ratingNote}</p>

              <div className="border border-slate-200 rounded-lg p-4">
                <p className="text-sm text-slate-600">Helpful</p>
                <p className="text-2xl font-bold text-slate-900">{p.feedback.helpful}</p>
                <p className="text-sm text-slate-500">{p.feedback.helpfulNote}</p>
              </div>
              <div className="border border-slate-200 rounded-lg p-4">
                <p className="text-sm text-slate-600">Problems reported</p>
                <p className="text-2xl font-bold text-slate-900">{p.feedback.problems}</p>
                <p className="text-sm text-slate-500">{p.feedback.problemsNote}</p>

                <ul className="space-y-1">
                  {feedback.map((f, i) => (
                    <li key={i} className="text-base text-slate-700">{c.figures[f.figId].label}: {f.helpful ? "helpful" : "not helpful"}{f.note ? ", “" + f.note + "”" : ""}</li>

          <div className={card}>
            <h3 className="font-semibold text-slate-900 text-lg mb-1">What we would improve next</h3>
            <p className="text-sm text-slate-500 mb-3">Proposed changes to the router and the resolution engine, each tied to the evidence above.</p>

              <table className="w-full text-sm">
                <thead>
                  <tr className="border-b border-slate-200">

                    <th className={th}>Proposed change</th>
                    <th className={th}>Evidence</th>
                    <th className={th}>Status</th>

    function RulesCard({ c, decision, eff, customLogic, onSaveLogic, onResetLogic, onGoToChallenge, onResetRule }) {
      const conflict = c.figures[c.conflictId];
      const defaults = c.routerRules.map((r) => ({ rule: r.rule, why: r.why, enabled: true, custom: false }));
      const [editing, setEditing] = useState(false);
      const [draft, setDraft] = useState(defaults);
      const active = customLogic || defaults;

      const startEdit = () => { setDraft((customLogic || defaults).map((r) => ({ ...r }))); setEditing(true); };
      const update = (i, patch) => setDraft((d) => d.map((r, k) => (k === i ? { ...r, ...patch } : r)));
      const move = (i, dir) => setDraft((d) => {
        const j = i + dir;
        if (j < 0 || j >= d.length) return d;
        const n = d.slice();
        const t = n[i];
        n[i] = n[j];
        n[j] = t;
        return n;
      });
      const remove = (i) => setDraft((d) => d.filter((r, k) => k !== i));
      const add = () => setDraft((d) => [...d, { rule: "", why: "", enabled: true, custom: true }]);
      const canSave = draft.every((r) => r.rule.trim()) && draft.some((r) => r.enabled);
      const save = () => {
        onSaveLogic(draft.map((r) => ({ ...r, rule: r.rule.trim(), why: r.why.trim() })));
        setEditing(false);
      };

      return (
        <div className="bg-white rounded-xl border border-slate-200 p-6">
          <div className="flex flex-wrap items-center justify-between gap-2 mb-1">
            <h3 className="font-semibold text-slate-900 text-lg">How we choose, and why</h3>
            {customLogic
              ? <span className="text-sm font-medium px-2.5 py-1 rounded-full bg-blue-100 text-blue-700">Custom logic for {c.clientName} memos</span>
              : <span className="text-sm font-medium px-2.5 py-1 rounded-full bg-slate-100 text-slate-600">Platform default logic</span>}
          </div>
          <p className="text-sm text-slate-500 mb-3">
            {customLogic
              ? "You have replaced the platform's default logic with your own for " + c.clientName + " memos. You can edit it or reset it at any time."
              : "This is the platform's default logic, from the trust order and cost policy agreed with the client. You can change it to your own logic for " + c.clientName + " memos."}
          </p>

          {!editing && (
            <div>
              <ol className="space-y-2 text-base text-slate-700">
                {active.map((r, i) => (
                  <li key={i} className={"flex gap-3 " + (r.enabled ? "" : "opacity-50")}>
                    <span className="font-semibold text-slate-400">{i + 1}</span>
                    <span>
                      <span className="font-medium text-slate-900">{r.rule}</span>
                      {r.custom && <span className="ml-2 text-xs font-semibold bg-blue-100 text-blue-700 px-2 py-0.5 rounded">Added by you</span>}
                      {!r.enabled && <span className="ml-2 text-xs font-semibold bg-slate-100 text-slate-600 px-2 py-0.5 rounded">Turned off</span>}
                      <br />
                      <span className="text-slate-600">Why: {r.why || "No reason given."}</span>
                    </span>
                  </li>
                ))}
              </ol>

              {decision.status === "decided" && decision.remember && (
                <div className="mt-4 p-4 bg-blue-50 border border-blue-200 rounded-lg text-base text-blue-900">
                  <p className="font-semibold">Rule from your decision: use "{eff.opt.label}" for {conflict.label}.</p>
                  <p className="text-sm text-blue-700 mt-1">You chose this and asked us to remember it for future {c.clientName} memos.</p>
                  <div className="flex gap-4 mt-2">
                    <button onClick={onGoToChallenge} className="text-blue-700 text-sm font-medium hover:underline">Change it</button>
                    <button onClick={onResetRule} className="text-slate-600 text-sm font-medium hover:underline">Remove it</button>
                  </div>
                </div>
              )}

              <div className="mt-4 flex flex-wrap items-center gap-4">
                <button onClick={startEdit} className="px-4 py-2 rounded-lg bg-blue-600 text-white text-base font-medium hover:bg-blue-700">{customLogic ? "Edit your logic" : "Change the logic"}</button>
                {customLogic && <button onClick={onResetLogic} className="text-slate-600 hover:text-slate-900 text-sm font-medium hover:underline">Reset to platform default</button>}
              </div>
              {customLogic && <p className="text-sm text-slate-500 mt-3">Illustrative: in this prototype your logic is saved and recorded in the audit trail, but it does not change the demo results.</p>}
            </div>
          )}

          {editing && (
            <div className="space-y-3">
              <p className="text-sm text-slate-600">Edit the rules, turn them on or off, change their order (the first rule has the highest priority), or add your own. Each rule should have a reason, so the committee can see why.</p>
              {draft.map((r, i) => (
                <div key={i} className="border border-slate-200 rounded-lg p-3 space-y-2">
                  <div className="flex items-center justify-between gap-2">
                    <span className="text-sm font-semibold text-slate-500">Rule {i + 1}{r.custom ? " (yours)" : ""}</span>
                    <div className="flex items-center gap-3">
                      <label className="flex items-center gap-1 text-sm text-slate-700">
                        <input type="checkbox" checked={r.enabled} onChange={(e) => update(i, { enabled: e.target.checked })} /> On
                      </label>
                      <button onClick={() => move(i, -1)} disabled={i === 0} className="text-sm text-slate-600 disabled:opacity-30">↑</button>
                      <button onClick={() => move(i, 1)} disabled={i === draft.length - 1} className="text-sm text-slate-600 disabled:opacity-30">↓</button>
                      {r.custom && <button onClick={() => remove(i)} className="text-sm text-red-600 hover:underline">Remove</button>}
                    </div>
                  </div>
                  <input type="text" value={r.rule} onChange={(e) => update(i, { rule: e.target.value })} placeholder="The rule" className="w-full p-2 rounded border border-slate-300 text-base" />
                  <input type="text" value={r.why} onChange={(e) => update(i, { why: e.target.value })} placeholder="Why (shown to the committee)" className="w-full p-2 rounded border border-slate-300 text-base" />
                </div>
              ))}
              <button onClick={add} className="text-blue-600 hover:underline text-base font-medium">+ Add your own rule</button>
              <div className="flex gap-2 pt-1">
                <button onClick={save} disabled={!canSave} className={"px-4 py-2 rounded-lg text-base font-medium " + (canSave ? "bg-blue-600 text-white hover:bg-blue-700" : "bg-slate-200 text-slate-500 cursor-not-allowed")}>Save my logic</button>
                <button onClick={() => setEditing(false)} className="px-4 py-2 rounded-lg text-base font-medium text-slate-700 hover:bg-slate-100">Cancel</button>
              </div>
            </div>
          )}
        </div>
      );
    }

    function WhereWeLookedTab({ c, decision, eff, onGoToChallenge, onShowDoc, onResetRule, customLogic, onSaveLogic, onResetLogic }) {
      const conflict = c.figures[c.conflictId];
      const pillStyle = { green: "bg-green-100 text-green-700", blue: "bg-blue-100 text-blue-700", grey: "bg-slate-100 text-slate-600" };
      const chipStyle = { Used: "bg-green-50 text-green-700 border-green-200", Reused: "bg-green-50 text-green-700 border-green-200", Skipped: "bg-slate-50 text-slate-500 border-slate-200" };
      return (
        <div className="max-w-3xl space-y-6">
          <div>
            <h2 className="text-2xl font-bold text-slate-900 mb-1">Where we looked</h2>
            <p className="text-base text-slate-600 mb-1">By source: what each source contributed to this memo, what it cost, and the evidence. It answers: are we looking in the right places? For how a single figure was reached, see the Audit trail.</p>
            <p className="text-sm text-slate-500 italic">Illustrative demo data.</p>
          </div>

          <p className="text-base text-slate-700">For this memo the system used {c.routerSummary[0].value} sources and skipped {c.routerSummary[1].value}.</p>

          <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
            {c.routerSummary.slice(0, 2).map((t, i) => (
              <div key={i} className="bg-white rounded-xl border border-slate-200 p-4">
                <p className="text-sm text-slate-600">{t.label}</p>
                <p className="text-3xl font-bold text-slate-900">{t.value}</p>
                <p className="text-sm text-slate-500">{t.note}</p>
              </div>
            ))}
          </div>

          <RulesCard c={c} decision={decision} eff={eff} customLogic={customLogic} onSaveLogic={onSaveLogic} onResetLogic={onResetLogic} onGoToChallenge={onGoToChallenge} onResetRule={onResetRule} />

          <div className="bg-white rounded-xl border border-slate-200 p-6">
            <h3 className="font-semibold text-slate-900 text-lg mb-3">Source by source</h3>
            <div className="space-y-3">
              {c.routerRows.map((r, i) => (
                <div key={i} className="border border-slate-200 rounded-lg p-4 flex justify-between items-start gap-4">
                  <div className="space-y-1">
                    <div className="flex flex-wrap items-center gap-2">
                      <p className="font-semibold text-slate-900 text-base">{r.name}</p>
                      <span className={"text-xs font-medium px-2 py-0.5 rounded border " + chipStyle[r.status]}>{r.status}</span>
                    </div>
                    <p className="text-base text-slate-700">{r.status === "Skipped" ? "Why skipped: " : "Result: "}{r.result}</p>
                    {c.routerVerdicts && c.routerVerdicts[i] && (
                      <div className="text-base text-slate-700">
                        <p><span className="text-sm font-semibold text-slate-500">Changed the answer? </span>{c.routerVerdicts[i].changed}</p>
                        <p><span className="text-sm font-semibold text-slate-500">Verdict: </span>{c.routerVerdicts[i].verdict}</p>
                      </div>
                    )}
                    {r.found && r.found.length > 0 && (
                      <div className="pt-1">
                        <p className="text-sm font-semibold text-slate-500">What we found</p>
                        <ul className="space-y-1">
                          {r.found.map((f, k) => (
                            <li key={k} className="text-base text-slate-700">• {f.text}{f.docId && <button onClick={() => onShowDoc(f.docId)} className="ml-2 text-sm text-blue-600 hover:underline">See in document →</button>}</li>
                          ))}
                        </ul>
                      </div>
                    )}
                  </div>
                  <span className={"text-sm font-medium px-2.5 py-1 rounded-full whitespace-nowrap " + pillStyle[r.color]}>{r.pill}</span>
                </div>
              ))}
            </div>
          </div>

          <div className="bg-white rounded-xl border border-slate-200 p-6">
            <h3 className="font-semibold text-slate-900 text-lg mb-2">In short</h3>
            <p className="text-base text-slate-700">{c.routerHelp}</p>
          </div>
        </div>
      );

    // ======================================================================
    // TAB: AUDIT TRAIL
    // ======================================================================
    function AuditTrailTab({ c, decision, eff, history, flagged, expandedId, onExpand, onShowDoc, onChallenge, onFlag }) {
      const [exportMsg, setExportMsg] = useState("");
      const [reportOpen, setReportOpen] = useState(null);
      const [reportNote, setReportNote] = useState("");

      const chains = {};
      let counter = 0;
      const numbered = {};
      c.figureOrder.forEach((id) => {
        chains[id] = buildChain(c, id, decision, eff, history);
        numbered[id] = chains[id].map((s) => { counter += 1; return { ...s, n: counter }; });
      });
      const total = counter;
      const pad = (n) => "#" + String(n).padStart(3, "0");

      const handleExport = () => {
        const lines = ["Audit pack — " + c.memo.title + " (" + c.memo.id + ")", "Illustrative demo data", ""];
        c.figureOrder.forEach((id) => {
          lines.push(c.figures[id].label.toUpperCase());
          numbered[id].forEach((s) => lines.push("  " + pad(s.n) + " " + formatStamp(s.time) + " [" + s.actor + "] " + s.text));
          lines.push("");
        });
        const blob = new Blob([lines.join("\n")], { type: "text/plain" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "audit-pack-" + c.id + ".txt";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        setExportMsg("✓ Audit pack downloaded (demo)");
      };

      const summaryFor = (id) => {
        const f = c.figures[id];
        if (f.kind === "conflict") {
          return decision.status === "decided"
            ? (decision.by === "system" ? "Decided by the system: " + f.options[decision.optionId].label + (decision.reviewed ? " · you reviewed it" : " · review available") : "You chose: " + f.options[decision.optionId].label)
            : "Proposed: " + f.options[c.recommendedId].label + " — awaiting your review";
        }
        if (f.kind === "derived") return f.summary + (decision.status === "decided" ? "" : " (awaiting the EBITDA decision)");
        return f.summary;
      };

      const pillFor = (id) => {
        const f = c.figures[id];
        if (f.kind === "conflict") return decision.status === "decided" ? <StatusPill status={decision.by === "system" ? "system" : "decided"} label={decision.by === "system" ? "Decided by system" : "Decided by you"} /> : <StatusPill status="proposed" label="Needs sign-off" />;
        return <StatusPill status="verified" label="Verified" />;
      };

      const actorStyle = { You: "bg-blue-100 text-blue-800", Router: "bg-indigo-100 text-indigo-800", Resolver: "bg-amber-100 text-amber-800", System: "bg-slate-100 text-slate-700" };

      return (
        <div className="max-w-3xl space-y-5">
          <div>
            <h2 className="text-2xl font-bold text-slate-900 mb-1">Audit trail</h2>
            <p className="text-base text-slate-600 mb-1">By figure: the full numbered record of how each figure was reached and who decided. It answers: can I replay and verify this number? For what each source contributed and cost, see Where we looked.</p>
            <p className="text-sm text-slate-500 italic">Illustrative demo data.</p>
          </div>

          <div className="bg-white rounded-xl border border-slate-200 p-5">
            <p className="text-sm font-semibold text-blue-600">What started this</p>
            <p className="text-base font-semibold text-slate-900">{c.user} clicked "{c.start.buttonLabel}" — {c.start.productLabel}</p>
            <ul className="mt-2 space-y-1 text-base text-slate-700">
              {c.start.fields.map((f, i) => (
                <li key={i}><span className="text-slate-500">{f[0]}:</span> {f[1]}</li>
              ))}
            </ul>
            <p className="text-sm text-slate-500 mt-2">Every figure below was requested by the system on the strength of this one action.</p>
          </div>

          <div className="flex flex-wrap items-center justify-between gap-3 bg-white rounded-xl border border-slate-200 p-4">
            <p className="text-base font-semibold text-slate-900">{total} steps recorded</p>
            <div className="flex items-center gap-3">
              {exportMsg && <span className="text-sm text-green-700">{exportMsg}</span>}
              <button onClick={handleExport} className="px-4 py-2 bg-blue-600 text-white rounded-lg text-base font-medium hover:bg-blue-700">Export audit pack</button>
            </div>
          </div>

          {c.figureOrder.map((id) => {
            const f = c.figures[id];
            const open = expandedId === id;
            return (
              <div key={id} className="bg-white rounded-xl border border-slate-200 overflow-hidden">
                <button onClick={() => onExpand(open ? null : id)} className="w-full px-6 py-4 flex items-center justify-between gap-4 hover:bg-slate-50 text-left">
                  <div>
                    <h3 className="font-semibold text-slate-900 text-lg">{f.label}</h3>
                    <p className="text-base text-slate-600">{summaryFor(id)}</p>
                  </div>
                  <div className="flex items-center gap-4">
                    <span className="font-bold text-slate-900 text-lg">{figureText(c, id, eff)}</span>
                    {pillFor(id)}
                    <span className="text-slate-400 text-xl">{open ? "−" : "+"}</span>
                  </div>
                </button>
                {open && (
                  <div className="px-6 py-5 border-t border-slate-200 bg-slate-50 space-y-4">
                    <ol className="space-y-3">
                      {numbered[id].map((s) => (
                        <li key={s.n} className="flex gap-3">
                          <span className="text-sm font-mono text-slate-400 pt-0.5">{pad(s.n)}</span>
                          <div className="space-y-1">
                            <div className="flex items-center gap-2">
                              <span className={"text-xs font-semibold px-2 py-0.5 rounded-full " + (actorStyle[s.actor] || actorStyle.System)}>{s.actor}</span>
                              <span className="text-sm text-slate-500">{formatStamp(s.time)}</span>
                            </div>
                            <p className="text-base text-slate-800">{s.text}</p>
                            {(s.docIds || (s.docId ? [s.docId] : [])).map((id) => (
                              <button key={id} onClick={() => onShowDoc(id)} className="mr-4 text-sm text-blue-600 hover:underline">{c.documents[id].name} p.{c.documents[id].page} →</button>
                            ))}
                          </div>
                        </li>
                      ))}
                    </ol>
                    <div className="pt-3 border-t border-slate-200 flex flex-wrap items-center gap-4">
                      {f.kind === "conflict" ? (
                        <button onClick={onChallenge} className="text-blue-600 hover:underline text-base font-medium">Challenge this figure</button>
                      ) : (
                        <>
                          <button onClick={() => { setReportOpen(reportOpen === id ? null : id); setReportNote(""); }} className="text-blue-600 hover:underline text-base font-medium">Report a problem with this figure</button>
                          {flagged.includes(id) && <span className="text-sm text-green-700">✓ Reported: a follow-up was logged and shows on the memo</span>}
                          {reportOpen === id && (
                            <div className="w-full space-y-2">
                              <label className="block text-sm font-semibold text-slate-900">What looks wrong? (required)</label>
                              <textarea value={reportNote} onChange={(e) => setReportNote(e.target.value)} rows={3} className="w-full p-3 rounded-lg border border-slate-300 text-base focus:outline-none focus:ring-2 focus:ring-blue-600" />
                              <div className="flex gap-2">
                                <button
                                  disabled={!reportNote.trim()}
                                  onClick={() => { onFlag(id, reportNote.trim()); setReportOpen(null); setReportNote(""); }}
                                  className={"px-4 py-2 rounded-lg text-base font-medium " + (reportNote.trim() ? "bg-blue-600 text-white hover:bg-blue-700" : "bg-slate-200 text-slate-500 cursor-not-allowed")}
                                >
                                  Send report
                                </button>
                                <button onClick={() => setReportOpen(null)} className="px-4 py-2 rounded-lg text-base font-medium text-slate-700 hover:bg-slate-100">Cancel</button>
                              </div>
                            </div>
                          )}
                        </>
                      )}
                    </div>
                  </div>
                )}
              </div>
            );
          })}
        </div>
      );
    }

              <h2 className="text-2xl font-bold text-slate-900">{s.title}</h2>

                <div key={i}>

            </div>
            <div>
              <p className="text-sm font-semibold text-slate-500 mb-2">Sections in this memo</p>
              <div className="flex flex-wrap gap-2">
                {s.sections.map((t, i) => (
                  <span key={i} className={"text-sm px-2.5 py-1 rounded-full border " + (s.keySections.includes(t) ? "bg-blue-50 border-blue-200 text-blue-800 font-medium" : "bg-slate-50 border-slate-200 text-slate-600")}>{t}</span>

            {!running ? (

              <ol className="space-y-2 pt-4 border-t border-slate-200">
                {s.runSteps.map((t, i) => (
                  <li key={i} className={"flex items-center gap-2 text-base " + (i < runStep ? "text-slate-800" : i === runStep ? "text-blue-700" : "text-slate-400")}>
                    <span className="w-5 text-center">{i < runStep ? "✓" : i === runStep ? "…" : "·"}</span>
                    <span>{t}</span>
                  </li>
                ))}
              </ol>
            )}
            <p className="text-sm text-slate-500">This is the only step the user takes. The engine does the rest, then you review.</p>
          </div>
        </div>
      );
    }

    function App() {
      const [caseId, setCaseId] = useState("credit");
      const [tab, setTab] = useState("memo");
      const [selectedFigure, setSelectedFigure] = useState(null);
      const [decision, setDecision] = useState(initialDecision(CASES.credit));
      const [draftOption, setDraftOption] = useState("contract");
      const [draftReason, setDraftReason] = useState("");
      const [draftRemember, setDraftRemember] = useState(false);
      const [editing, setEditing] = useState(false);
      const [history, setHistory] = useState({});
      const [flagged, setFlagged] = useState([]);
      const [submitted, setSubmitted] = useState(false);
      const [messages, setMessages] = useState([]);
      const [customLogic, setCustomLogic] = useState(null);
      const [viewMode, setViewMode] = useState("committee");
      const [feedback, setFeedback] = useState([]);
      const [showDocId, setShowDocId] = useState(null);
      const [expandedAudit, setExpandedAudit] = useState("ebitda");
      const [phase, setPhase] = useState("start");
      const [runStep, setRunStep] = useState(0);

      const c = CASES[caseId];
      const eff = getEffective(c, decision);
      const pending = decision.status !== "decided";
      const ackNeeded = decision.status === "decided" && decision.by === "system" && !decision.reviewed;

      useEffect(() => {
        if (phase !== "running") return undefined;
        const total = CASES[caseId].start.runSteps.length;
        if (runStep >= total) {
          const done = setTimeout(() => setPhase("ready"), 500);
          return () => clearTimeout(done);
        }
        const next = setTimeout(() => setRunStep((n) => n + 1), 800);
        return () => clearTimeout(next);
      }, [phase, runStep, caseId]);

      const resetAll = (id) => {
        setCaseId(id);
        setTab("memo");
        setSelectedFigure(null);
        setDecision(initialDecision(CASES[id]));
        setDraftOption(CASES[id].recommendedId);
        setDraftReason("");
        setDraftRemember(false);
        setEditing(false);
        setHistory({});
        setFlagged([]);
        setSubmitted(false);
        setMessages([]);
        setCustomLogic(null);
        setShowDocId(null);
        setExpandedAudit(CASES[id].conflictId);
        setFeedback([]);
        setPhase("start");
        setRunStep(0);
      };

      const addHistory = (figId, items) => {
        setHistory((prev) => ({ ...prev, [figId]: [...(prev[figId] || []), ...items] }));
      };

      const handleConfirm = () => {
        const time = nowHHMM();
        const conflict = c.figures[c.conflictId];
        const o = conflict.options[draftOption];
        const reason = draftReason.trim();
        const isRec = draftOption === c.recommendedId;
        const items = [{
          time, actor: "You",
          text: (isRec ? "Confirmed the system's decision: " : "Changed the system's decision to ") + o.label + " (" + o.valueText + ")." + (reason ? " Reason: " + reason : ""),
          docIds: o.docLinks ? o.docLinks.map((l) => l.docId) : (o.docId ? [o.docId] : []),
        }];
        if (draftRemember) items.push({ time, actor: "You", text: "Saved as the default rule for " + c.clientName + " memos." });
        addHistory(c.conflictId, items);
        setDecision({ status: "decided", optionId: draftOption, reason, remember: draftRemember, at: time, by: "you", reviewed: true });
        setEditing(false);
        setDraftReason("");
      };

      const handleEdit = () => {
        setEditing(true);
        setDraftOption(decision.optionId);
        setDraftReason("");
        setDraftRemember(false);
      };

      const handleFeedback = (figId, helpful, note) => {
        addHistory(figId, [{ time: nowHHMM(), actor: "You", text: "Feedback on the explanation: " + (helpful ? "helpful" : "not helpful") + (note ? ". Comment: " + note : "") + " (sent to the product team)." }]);
        setFeedback((prev) => [...prev, { figId, helpful, note }]);
      };

      const handleSaveLogic = (rules) => {
        addHistory(c.conflictId, [{ time: nowHHMM(), actor: "You", text: "Changed the default logic for " + c.clientName + " memos: " + rules.filter((r) => r.enabled).length + " active rules, " + rules.filter((r) => r.custom).length + " added by you." }]);
        setCustomLogic(rules);
      };

      const handleResetLogic = () => {
        addHistory(c.conflictId, [{ time: nowHHMM(), actor: "You", text: "Reset the logic to the platform default for " + c.clientName + " memos." }]);
        setCustomLogic(null);
      };

      const handleResetRule = () => {
        addHistory(c.conflictId, [{ time: nowHHMM(), actor: "You", text: "Removed the saved rule; the default logic applies again." }]);
        setDecision((d) => ({ ...d, remember: false }));
      };

      const handleAcknowledge = () => {
        addHistory(c.conflictId, [{ time: nowHHMM(), actor: "You", text: "Reviewed the system's decision and accepted it." }]);
        setDecision((d) => ({ ...d, reviewed: true }));
      };

      const goToAudit = (figId) => { setExpandedAudit(figId); setTab("audit"); };

      const goToChallenge = () => {
        setTab("memo");
        setSelectedFigure(c.conflictId);
        if (decision.status === "decided") handleEdit();
      };

      const handleFlag = (figId, note) => {
        addHistory(figId, [{ time: nowHHMM(), actor: "You", text: "Reported a problem: " + note + " (follow-up logged)." }]);
        setFlagged((prev) => (prev.includes(figId) ? prev : [...prev, figId]));
      };

      const handleSubmit = () => {
        addHistory(c.conflictId, [{ time: nowHHMM(), actor: "You", text: "Submitted the memo to committee." }]);
        setSubmitted(true);
      };

      const tabs = [["memo", "Memo"], ["sources", "Where we looked"], ["audit", "Audit trail"]];

      return (
        <div className="min-h-screen flex flex-col">
          <header className="sticky top-0 z-40 bg-white border-b border-slate-200">
            <div className="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 bg-blue-600 text-white flex items-center justify-center rounded-lg font-bold text-sm">(In)</div>
                <div>
                  <h1 className="text-xl font-bold text-slate-900">{c.id === "credit" ? "Credit Companion" : "(In)Alpha"} · Evidence Check</h1>
                  <p className="text-sm text-slate-500">{c.memo.title} · {c.memo.id}</p>
                </div>
              </div>
              <div className="flex items-center gap-4">
                <div className="flex border border-slate-300 rounded-lg overflow-hidden">
                  <button onClick={() => resetAll("credit")} className={"px-4 py-2 text-sm font-medium " + (caseId === "credit" ? "bg-blue-600 text-white" : "bg-white text-slate-700 hover:bg-slate-50")}>Credit case</button>
                  <button onClick={() => resetAll("invest")} className={"px-4 py-2 text-sm font-medium border-l border-slate-300 " + (caseId === "invest" ? "bg-blue-600 text-white" : "bg-white text-slate-700 hover:bg-slate-50")}>Investment case</button>
                </div>
                <div className="flex border border-slate-300 rounded-lg overflow-hidden">
                  <button onClick={() => setViewMode("committee")} className={"px-3 py-2 text-sm font-medium " + (viewMode === "committee" ? "bg-slate-900 text-white" : "bg-white text-slate-700 hover:bg-slate-50")}>Committee view</button>
                  <button onClick={() => setViewMode("platform")} className={"px-3 py-2 text-sm font-medium border-l border-slate-300 " + (viewMode === "platform" ? "bg-slate-900 text-white" : "bg-white text-slate-700 hover:bg-slate-50")}>Platform team view</button>
                </div>
                <button onClick={() => resetAll(caseId)} className="text-sm text-slate-500 hover:text-slate-800 underline">Reset demo</button>
              </div>
            </div>
            <div className={"max-w-7xl mx-auto px-4 flex gap-2" + (phase === "ready" && viewMode === "committee" ? "" : " hidden")}>
              {tabs.map((t) => (
                <button
                  key={t[0]}
                  onClick={() => setTab(t[0])}
                  className={"relative px-4 py-2.5 text-base font-medium border-b-2 " + (tab === t[0] ? "border-blue-600 text-blue-600" : "border-transparent text-slate-600 hover:text-slate-900")}
                >
                  {t[1]}
                  {t[0] === "audit" && pending && <span className="absolute top-2 right-0 w-2 h-2 bg-amber-500 rounded-full" />}
                </button>
              ))}
            </div>
          </header>

          <main className="flex-1">
            <div className="max-w-7xl mx-auto px-4 py-8">
              {viewMode === "platform" && <PlatformView c={c} feedback={feedback} />}

              {viewMode === "committee" && phase !== "ready" && <StartScreen c={c} phase={phase} runStep={runStep} onStart={() => { setRunStep(0); setPhase("running"); }} />}

              {viewMode === "committee" && phase === "ready" && tab === "memo" && (
                <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                  <div className="lg:col-span-2 space-y-6">
                    <div className={"rounded-xl p-4 flex items-center justify-between text-base " + (pending ? "bg-amber-50 border border-amber-200" : ackNeeded ? "bg-sky-50 border border-sky-200" : "bg-green-50 border border-green-200")}>
                      <p className={"font-medium " + (pending ? "text-amber-900" : ackNeeded ? "text-sky-900" : "text-green-900")}>
                        {pending ? (c.figureOrder.length - 1) + " of " + c.figureOrder.length + " key figures verified · 1 needs your sign-off" : ackNeeded ? (c.figureOrder.length - 1) + " of " + c.figureOrder.length + " key figures verified · 1 decided by the system, please review" : "All " + c.figureOrder.length + " key figures verified or decided"}
                      </p>
                      {(pending || ackNeeded) && (
                        <button onClick={() => setSelectedFigure(c.conflictId)} className="text-amber-800 hover:text-amber-950 font-medium text-sm underline">Review now</button>
                      )}
                    </div>

                    {flagged.length > 0 && (
                      <div className="rounded-xl p-4 bg-amber-50 border border-amber-200 text-base text-amber-900 flex items-center justify-between gap-3">
                        <span>{flagged.length} figure{flagged.length > 1 ? "s" : ""} flagged for follow-up: {flagged.map((fid) => c.figures[fid].label).join(", ")}</span>
                        <button onClick={() => goToAudit(flagged[0])} className="text-sm font-medium underline">View report</button>
                      </div>
                    )}

                    <MemoCard c={c} eff={eff} decision={decision} selectedFigure={selectedFigure} onSelect={setSelectedFigure} />

                    <div className="bg-white rounded-xl border border-slate-200 p-6">
                      <button
                        onClick={handleSubmit}
                        disabled={pending || ackNeeded || submitted}
                        className={"w-full py-3 rounded-lg font-medium text-base transition " + (pending || ackNeeded || submitted ? "bg-slate-200 text-slate-500 cursor-not-allowed" : "bg-blue-600 text-white hover:bg-blue-700")}
                      >
                        Submit to committee
                      </button>
                      {pending && <p className="text-sm text-slate-500 mt-2">1 figure still needs your sign-off.</p>}
                      {ackNeeded && <p className="text-sm text-slate-500 mt-2">Review the figure decided by the system before submitting.</p>}
                      {submitted && <p className="text-sm text-green-700 mt-2">✓ Memo submitted to committee</p>}
                    </div>

                    <AskBox c={c} eff={eff} decision={decision} messages={messages} onAdd={(m) => setMessages((prev) => [...prev, m])} onShowDoc={setShowDocId} />
                  </div>

                  <div className="lg:col-span-1 lg:sticky lg:top-36 lg:self-start">
                    <EvidencePanel
                      c={c}
                      selectedFigure={selectedFigure}
                      decision={decision}
                      eff={eff}
                      draftOption={draftOption}
                      draftReason={draftReason}
                      draftRemember={draftRemember}
                      editing={editing}
                      onDraftOption={setDraftOption}
                      onDraftReason={setDraftReason}
                      onDraftRemember={setDraftRemember}
                      onConfirm={handleConfirm}
                      onSelect={setSelectedFigure}
                      onShowDoc={setShowDocId}
                      onEdit={handleEdit}
                      onCancelEdit={() => setEditing(false)}
                      onGoToAudit={goToAudit}
                      onAcknowledge={handleAcknowledge}
                      onFeedback={handleFeedback}
                    />
                  </div>
                </div>
              )}

              {viewMode === "committee" && phase === "ready" && tab === "sources" && <WhereWeLookedTab c={c} decision={decision} eff={eff} onGoToChallenge={goToChallenge} onShowDoc={setShowDocId} onResetRule={handleResetRule} customLogic={customLogic} onSaveLogic={handleSaveLogic} onResetLogic={handleResetLogic} />}

              {viewMode === "committee" && phase === "ready" && tab === "audit" && (
                <AuditTrailTab
                  c={c}
                  decision={decision}
                  eff={eff}
                  history={history}
                  flagged={flagged}
                  expandedId={expandedAudit}
                  onExpand={setExpandedAudit}
                  onShowDoc={setShowDocId}
                  onChallenge={goToChallenge}
                  onFlag={handleFlag}
                />
              )}
            </div>
          </main>

          <DocModal doc={showDocId ? c.documents[showDocId] : null} onClose={() => setShowDocId(null)} />

          <footer className="bg-white border-t border-slate-200 py-4 text-center text-sm text-slate-500">
            Powered by G42 Financial Data Intelligence Platform
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
